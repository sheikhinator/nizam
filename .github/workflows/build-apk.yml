name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: List repo contents
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== zips found ==="
          find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn || true

      - name: Unzip the newest zip into a clean folder
        run: |
          set -e
          rm -rf _build
          mkdir -p _build
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o -q "$ZIP" -d _build

      - name: Locate the Gradle project
        id: proj
        run: |
          set -e
          SETTINGS=$(find _build -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found inside the zip."
            find _build -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project at: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"

          echo "=== platforms already installed ==="
          ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "=== build-tools already installed ==="
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK/platforms/android-34" ]; then
              echo "Installing platform 34..."
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
            fi
          fi

      - name: Fetch emulator cores
        run: |
          set -e
          DIR="${{ steps.proj.outputs.dir }}/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DIR"
          for core in gambatte mgba fceumm snes9x mupen64plus_next_gles3 melonds pcsx_rearmed ppsspp genesis_plus_gx mednafen_pce_fast stella handy mednafen_wswan; do
            if curl -fsSL --retry 3 "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${core}_libretro_android.so.zip" -o "/tmp/${core}.zip"; then
              unzip -o -q "/tmp/${core}.zip" -d "/tmp/core_${core}"
              cp "/tmp/core_${core}/${core}_libretro_android.so" "$DIR/lib${core}_libretro_android.so"
              echo "core ok: $core"
            else
              echo "::warning::could not fetch core $core"
            fi
          done
          ls -la "$DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show compile errors only
        if: failure()
        run: |
          echo "==================== ERRORS ===================="
          grep -E "^e: |error:" /tmp/build.log | head -n 60 || echo "No 'error:' lines found — see the full log above."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Find the APK
        if: success()
        id: apk
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "./.git/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but no app-debug.apk exists."
            echo "=== anything under build/outputs ==="
            find . -path "*build/outputs*" -type f | head -n 40 || true
            exit 1
          fi
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
