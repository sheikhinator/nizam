name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: List repo contents
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== every zip found ==="
          find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn

      - name: Unzip the newest zip into a clean folder
        run: |
          set -e
          rm -rf _build
          mkdir -p _build
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o -q "$ZIP" -d _build
          echo "=== extracted ==="
          find _build -maxdepth 2 -type d

      - name: Locate the Gradle project
        id: proj
        run: |
          set -e
          SETTINGS=$(find _build -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found inside the zip."
            find _build -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project at: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show compile errors only
        if: failure()
        run: |
          echo "=================== ERRORS ==================="
          grep -E "^e: |error:" /tmp/build.log | head -n 60 || echo "No 'error:' lines — see full log above."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Find the APK
        if: success()
        id: apk
        run: |
          APK=$(find _build -name "app-debug.apk" | head -n 1)
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
