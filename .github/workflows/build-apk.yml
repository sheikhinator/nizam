name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: List repo contents
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== zips found ==="
          find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn || true

      - name: Unzip the newest zip into a clean folder
        run: |
          set -e
          rm -rf _build
          mkdir -p _build
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o -q "$ZIP" -d _build

      - name: Locate the Gradle project
        id: proj
        run: |
          set -e
          SETTINGS=$(find _build -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found inside the zip."
            find _build -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project at: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"

          echo "=== platforms already installed ==="
          ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "=== build-tools already installed ==="
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            for P in 34 35 36; do
              [ -d "$SDK/platforms/android-$P" ] || "$SDKMANAGER" "platforms;android-$P" || true
            done
            [ -d "$SDK/build-tools/35.0.0" ] || "$SDKMANAGER" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Dump library APIs
        continue-on-error: true
        run: |
          mkdir -p /tmp/d && cd /tmp/d
          get() { curl -sfL -o "$2" "https://dl.google.com/android/maven2/$1" && echo "got $1" || echo "MISSING $1"; }
          get androidx/appfunctions/appfunctions/1.0.0-alpha08/appfunctions-1.0.0-alpha08.aar af.aar
          get androidx/appfunctions/appfunctions-service/1.0.0-alpha08/appfunctions-service-1.0.0-alpha08.aar afs.aar
          get androidx/xr/projected/projected/1.0.0-alpha09/projected-1.0.0-alpha09.aar xr.aar
          get androidx/health/connect/connect-client/1.1.0-alpha12/connect-client-1.1.0-alpha12.aar hc.aar
          for f in af afs xr hc; do
            [ -f $f.aar ] || continue
            mkdir -p $f && unzip -o -q $f.aar classes.jar -d $f || continue
            echo "######## $f"
            CL=$(unzip -l $f/classes.jar | awk '{print $4}' | grep '\.class$' | grep -v '\$' | sed 's/\.class$//')
            case $f in hc) CL=$(echo "$CL" | grep -E 'records/metadata/Metadata$');; esac
            for c in $CL; do javap -cp $f/classes.jar "$c" 2>/dev/null | grep -v '^Compiled'; done
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          ATLAS_KEY_GEMINI: ${{ secrets.ATLAS_KEY_GEMINI }}
          ATLAS_KEY_OPENROUTER: ${{ secrets.ATLAS_KEY_OPENROUTER }}
          ATLAS_KEY_CUSTOM: ${{ secrets.ATLAS_KEY_CUSTOM }}
          ATLAS_KEY_CUSTOM_URL: ${{ secrets.ATLAS_KEY_CUSTOM_URL }}
          ATLAS_KEY_CUSTOM_MODEL: ${{ secrets.ATLAS_KEY_CUSTOM_MODEL }}
          ATLAS_KEY_FAST: ${{ secrets.ATLAS_KEY_FAST }}
          ATLAS_KEY_FAST_URL: ${{ secrets.ATLAS_KEY_FAST_URL }}
          ATLAS_KEY_FAST_MODEL: ${{ secrets.ATLAS_KEY_FAST_MODEL }}
          ATLAS_KEY_HADITH: ${{ secrets.ATLAS_KEY_HADITH }}
          ATLAS_KEY_TMDB: ${{ secrets.ATLAS_KEY_TMDB }}
          ATLAS_KEY_OMDB: ${{ secrets.ATLAS_KEY_OMDB }}
          ATLAS_KEY_JAMENDO: ${{ secrets.ATLAS_KEY_JAMENDO }}
          ATLAS_KEY_HF: ${{ secrets.ATLAS_KEY_HF }}
          ATLAS_KEY_TOMTOM: ${{ secrets.ATLAS_KEY_TOMTOM }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show compile errors only
        if: failure()
        run: |
          echo "==================== ERRORS ===================="
          grep -E "^e: |error:" /tmp/build.log | head -n 60 || echo "No 'error:' lines found — see the full log above."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Find the APK
        if: success()
        id: apk
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "./.git/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but no app-debug.apk exists."
            echo "=== anything under build/outputs ==="
            find . -path "*build/outputs*" -type f | head -n 40 || true
            exit 1
          fi
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Every good build is published as a GitHub Release, so the APK downloads with one tap
      # from the repo's Releases page (the GitHub mobile app doesn't show build artifacts).
      - name: Publish APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp "${{ steps.apk.outputs.path }}" Atlas.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Atlas.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Atlas build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at ${GITHUB_SHA::7}. Download Atlas.apk below and install it over the previous version." \
            --latest
