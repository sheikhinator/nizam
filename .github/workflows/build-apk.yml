name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (to extracted/)
        run: |
          unzip -o nizam-android.zip -d extracted
          echo "Contents of extracted/ top-level:"
          ls -la extracted || true

      - name: Find and print Kotlin DB files and imports (from extracted/)
        run: |
          echo "Searching for NizamDatabase.kt inside extracted/ and printing top of file(s):"
          find extracted -type f -name 'NizamDatabase.kt' -print -exec sed -n '1,200p' {} \; || true

          echo "Also printing any imports containing 'Article' or 'NewsDao' in extracted/:"
          grep -R --line-number --no-messages -E "import .*Article|import .*NewsDao" extracted || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f extracted/nizam/gradlew ]; then
            chmod +x extracted/nizam/gradlew
          elif [ -f extracted/gradlew ]; then
            chmod +x extracted/gradlew
          else
            echo "Warning: gradlew not found in extracted/"
            ls -la extracted || true
          fi

      - name: Build debug APK (using Gradle wrapper if available)
        working-directory: extracted/nizam
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: extracted/nizam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
