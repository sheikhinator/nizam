name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # atlas/live is moved forward by the engineer's own pushes (which build) and by plain syncs (which don't need a second build)
    if: github.ref != 'refs/heads/atlas/live' || startsWith(github.event.head_commit.message, 'Chief:')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 80

      - name: List repo contents
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== zips found ==="
          find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn || true

      - name: Unzip the newest zip into a clean folder
        run: |
          set -e
          rm -rf _build
          mkdir -p _build
          # the unpacked project folder is the source of truth; the zip is only a fallback
          if [ -f project/settings.gradle.kts ]; then
            echo "Using the project folder"
            cp -a project _build/project
            exit 0
          fi
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o -q "$ZIP" -d _build

      - name: Locate the Gradle project
        id: proj
        run: |
          set -e
          SETTINGS=$(find _build -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found inside the zip."
            find _build -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project at: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"

          echo "=== platforms already installed ==="
          ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "=== build-tools already installed ==="
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            for P in 34 35 36; do
              [ -d "$SDK/platforms/android-$P" ] || "$SDKMANAGER" "platforms;android-$P" || true
            done
            [ -d "$SDK/build-tools/35.0.0" ] || "$SDKMANAGER" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle the Arcade emulator cores
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$D"
          for c in gambatte mgba fceumm snes9x mupen64plus_next_gles3 melonds mednafen_vb pcsx_rearmed ppsspp genesis_plus_gx picodrive yabasanshiro flycast fbneo mednafen_pce_fast stella prosystem handy mednafen_ngp mednafen_wswan bluemsx; do
            rm -rf "/tmp/core_$c"; mkdir -p "/tmp/core_$c"
            if curl -fsSL --retry 4 --retry-delay 5 -o "/tmp/$c.zip" "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip" \
               && unzip -o -q "/tmp/$c.zip" -d "/tmp/core_$c"; then
              SO=$(find "/tmp/core_$c" -name "*.so" | head -n 1)
              if [ -n "$SO" ]; then mv "$SO" "$D/lib${c}_libretro_android.so"; else echo "::warning::no .so inside the $c download"; fi
            else
              echo "::warning::couldn't download the $c core; the app will offer to download it"
            fi
          done
          ls -la "$D"
          du -sh "$D"

      # The in-app "What's new" reads this: the recent changes, newest first, written from the commit history
      - name: Write the What's new list
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p app/src/main/assets
          git -C "$GITHUB_WORKSPACE" log -80 --no-merges --format='%ct|%h|%s' \
            | sed -E 's/\[[a-z]+\]//g; s/ +$//' | grep -viE '\|(wip|tmp|test|merge)' > app/src/main/assets/changelog.txt || true
          wc -l app/src/main/assets/changelog.txt

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          ATLAS_KEY_GEMINI: ${{ secrets.ATLAS_KEY_GEMINI }}
          ATLAS_KEY_OPENROUTER: ${{ secrets.ATLAS_KEY_OPENROUTER }}
          ATLAS_KEY_CUSTOM: ${{ secrets.ATLAS_KEY_CUSTOM }}
          ATLAS_KEY_CUSTOM_URL: ${{ secrets.ATLAS_KEY_CUSTOM_URL }}
          ATLAS_KEY_CUSTOM_MODEL: ${{ secrets.ATLAS_KEY_CUSTOM_MODEL }}
          ATLAS_KEY_FAST: ${{ secrets.ATLAS_KEY_FAST }}
          ATLAS_KEY_FAST_URL: ${{ secrets.ATLAS_KEY_FAST_URL }}
          ATLAS_KEY_FAST_MODEL: ${{ secrets.ATLAS_KEY_FAST_MODEL }}
          ATLAS_KEY_HADITH: ${{ secrets.ATLAS_KEY_HADITH }}
          ATLAS_KEY_TMDB: ${{ secrets.ATLAS_KEY_TMDB }}
          ATLAS_KEY_OMDB: ${{ secrets.ATLAS_KEY_OMDB }}
          ATLAS_KEY_JAMENDO: ${{ secrets.ATLAS_KEY_JAMENDO }}
          ATLAS_KEY_HF: ${{ secrets.ATLAS_KEY_HF }}
          ATLAS_KEY_TOMTOM: ${{ secrets.ATLAS_KEY_TOMTOM }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Audit every tool and screen
        if: success() && contains(github.event.head_commit.message, '[audit]')
        continue-on-error: true
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle testDebugUnitTest --tests 'com.nizam.app.SpecLogicAudit' --tests 'com.nizam.app.MappingTest' --tests 'com.nizam.app.RefreshTest' --tests 'com.nizam.app.Audit' --no-daemon --continue 2>&1 | tail -n 25
          echo "=================== AUDIT REPORT: TOOLS ==================="
          head -n 150 app/build/audit/tools.txt 2>/dev/null || echo "no tools report"
          echo "=================== AUDIT REPORT: SCREENS ==================="
          head -n 400 app/build/audit/screens.txt 2>/dev/null || echo "no screens report"
          echo "screens ok: $(wc -l < app/build/audit/screens_ok.txt 2>/dev/null || echo 0)"
          echo "=================== MAPPING ==================="
          cat app/build/audit/mapping.txt 2>/dev/null || echo "no mapping report"
          echo "=================== REFRESH ==================="
          cat app/build/audit/refresh.txt 2>/dev/null || echo "no refresh report"
          echo "=================== CRASHES ==================="
          cat app/build/audit/screens_crash.txt 2>/dev/null | head -n 400 || echo "none"
          echo "=================== TEST RESULTS ==================="
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -o '<testsuite [^>]*' "$f" | grep -o 'name="[^"]*"\|tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"' | tr '\n' ' '; echo; done 2>/dev/null | head -20
          grep -h -A4 "<failure\|<error" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 80 || true

      - name: Lint for likely crashes
        if: success() && contains(github.event.head_commit.message, '[lint]')
        continue-on-error: true
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle lintDebug --no-daemon 2>&1 | tail -n 15
          python3 - <<'PY'
          import re,glob
          for f in glob.glob('app/build/reports/lint-results-debug.xml'):
              t=open(f,encoding='utf8',errors='ignore').read()
              items=re.findall(r'<issue\s+id="([^"]+)"\s+severity="(Error|Fatal)"[^>]*message="([^"]*)"[\s\S]*?<location\s+file="([^"]+)"(?:\s+line="(\d+)")?',t)
              print("LINT ERRORS:",len(items))
              for i,sev,m,fl,ln in items[:150]: print(i,'|',fl.split('com/nizam/app/')[-1],ln,'|',m[:150])
          PY

      - name: Show compile errors only
        if: failure()
        run: |
          echo "==================== ERRORS ===================="
          grep -E "^e: |error:" /tmp/build.log | head -n 60 || echo "No 'error:' lines found — see the full log above."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Find the APK
        if: success()
        id: apk
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "./.git/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but no app-debug.apk exists."
            echo "=== anything under build/outputs ==="
            find . -path "*build/outputs*" -type f | head -n 40 || true
            exit 1
          fi
          echo "Found: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Every good build is published as a GitHub Release, so the APK downloads with one tap
      # from the repo's Releases page (the GitHub mobile app doesn't show build artifacts).
      - name: Publish APK as a release
        if: success() && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp "${{ steps.apk.outputs.path }}" Atlas.apk
          TAG="build-${{ github.run_number }}"
          SUBJECT="$(git log -1 --format=%s | sed -E 's/\[[a-z]+\]//g; s/ +$//')"
          printf '%s\n\nBuilt from %s at %s. Download Atlas.apk below and install it over the previous version.\n' "$SUBJECT" "${{ github.ref_name }}" "${GITHUB_SHA::7}" > notes.md
          gh release create "$TAG" Atlas.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Atlas build ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest

      - name: Screenshots of the main screens
        if: success() && contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle testDebugUnitTest --tests 'com.nizam.app.Shots' --no-daemon 2>&1 | tail -n 40
          echo "=== failures ==="
          grep -h -A6 "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 120 || true
          ls app/build/shots || true
          if ls app/build/shots/*.png >/dev/null 2>&1; then
            (cd app/build/shots && zip -q "$GITHUB_WORKSPACE/shots.zip" *.png)
            gh release upload "build-${{ github.run_number }}" "$GITHUB_WORKSPACE/shots.zip" --repo "${{ github.repository }}" --clobber || echo "no release for this build; shots kept as an artifact"
          fi

      - name: Keep the screenshots
        if: always() && contains(github.event.head_commit.message, '[shots]')
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ steps.proj.outputs.dir }}/app/build/shots/
          if-no-files-found: ignore
