name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o nizam-android.zip
          echo "Contents after unzip:"
          ls -la

      - name: Find and print Kotlin DB files and imports
        run: |
          echo "Searching for NizamDatabase.kt and printing top of file(s):"
          find . -type f -name 'NizamDatabase.kt' -print -exec sed -n '1,200p' {} \; || true
          echo "Also printing any imports containing 'Article' or 'NewsDao' (for all .kt files):"
          grep -R --line-number --no-messages -E "import .*Article|import .*NewsDao" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f nizam/gradlew ]; then
            chmod +x nizam/gradlew
          elif [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Warning: gradlew not found"
            ls -la || true
          fi

      - name: Build debug APK (using Gradle wrapper if available)
        working-directory: nizam
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nizam-debug-apk
          path: nizam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
