name: Arcade core test

on:
  push:
    branches: [ atlas/spine ]

jobs:
  core-test:
    # Only runs when the commit message asks for it, since booting an emulator is slow.
    if: contains(github.event.head_commit.message, '[coretest]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fetch arcade emulator cores (arm64 + x86_64)
        working-directory: project
        run: |
          set +e
          CORES="gambatte:gambatte mgba:mgba fceumm:fceumm snes9x:snes9x mupen64plus_next_gles3:mupen64plus_next_gles3 melonds:melonds pcsx_rearmed:pcsx_rearmed ppsspp:ppsspp genesis_plus_gx:genesis_plus_gx mednafen_pce_fast:mednafen_pce_fast stella:stella handy:handy mednafen_wswan:mednafen_wswan"
          for ABI in arm64-v8a x86_64; do
            DEST="app/src/main/jniLibs/$ABI"; mkdir -p "$DEST"
            BASE="https://buildbot.libretro.com/nightly/android/latest/$ABI"
            for PAIR in $CORES; do
              APP="${PAIR%%:*}"; BB="${PAIR##*:}"
              for try in 1 2 3; do
                curl -fsSL "$BASE/${BB}_libretro_android.so.zip" -o /tmp/c.zip && unzip -o -q /tmp/c.zip -d /tmp/c \
                  && mv "/tmp/c/${BB}_libretro_android.so" "$DEST/lib${APP}_libretro_android.so" && break
                sleep 3
              done
              rm -rf /tmp/c /tmp/c.zip
            done
            echo "== $ABI =="; ls -la "$DEST"
          done

      - name: Run core-load test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: project
          script: |
            adb logcat -c || true
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.nizam.app --no-daemon --stacktrace || true
            echo "=================== CORETEST + GAMETEST LOG ==================="
            adb logcat -d -s CORETEST:V GAMETEST:V | sed -E 's/^.*(CORETEST|GAMETEST) *: //'
            echo "=================== END LOG ==================="
